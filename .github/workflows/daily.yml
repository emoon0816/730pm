name: daily

# 手动触发 + 每 15 分钟"敲门"。真正的生成只在「今天还没出」且「过了北京时间 19:00」时发生，
# 这样 GitHub 的 cron 延迟/丢任务不会让报纸断更。
on:
  workflow_dispatch:
    inputs:
      only:
        description: '只跑某个板块（thing / reading / trivia / food_today / tech_science_ent / sport_hot_game / head_oil_politics），留空跑全部'
        required: false
        default: ''
      no_push:
        description: '只生成，不推回仓库'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 决定今天要不要出报
        id: decide
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发，直接跑"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, datetime
          tz = datetime.timezone(datetime.timedelta(hours=8))
          now = datetime.datetime.now(tz)
          today = f"{now.year}年{now.month}月{now.day}日"
          window = 19 <= now.hour <= 21
          done = False
          try:
              d = json.load(open("data.json", encoding="utf-8"))
              done = (d.get("date") or "").strip() == today
          except Exception as e:
              print("读 data.json 失败:", e)
          run = window and not done
          print(f"now={now:%Y-%m-%d %H:%M} today={today} window={window} done={done} run={run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("run=true\n" if run else "run=false\n")
          PY

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成板块
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DS_MODEL: deepseek-flash
        run: |
          set -e
          if [ -n "${{ inputs.only }}" ]; then
            python scripts/build_daily.py --only "${{ inputs.only }}" --no-push
          else
            python scripts/build_daily.py --no-push
          fi

      - name: 归档并重建历史页
        run: |
          python archive.py
          python build.py

      - name: 提交
        if: ${{ inputs.no_push != true }}
        run: |
          set -e
          git config user.name "730pm bot"
          git config user.email "730pm-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "没有改动"
          else
            git commit -m "daily: $(TZ=Asia/Shanghai date +%F)"
            git push
          fi

      - name: 摘要
        if: always()
        run: |
          echo "## 今天的数据" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open("data.json", encoding="utf-8"))
          print(f"- 日期：{d.get('date')} {d.get('weekday')}")
          for t in d.get("tabs", []):
              n = sum(len(g.get("items") or []) for g in t.get("groups") or [])
              if t.get("reading"): n = 1
              if t.get("thing"): n = 1
              print(f"- {t.get('name')}：{n} 条")
          PY
