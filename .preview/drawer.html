<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置抽屉 · 预览</title>
<style>
@font-face{font-family:'ChillRound';src:url('../fonts/ChillRoundGothic_Medium.ttf') format('truetype');font-weight:500;font-display:swap;}
@font-face{font-family:'BarlowCond';src:url('../fonts/BarlowCondensed-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
:root{
  --bg:#F4EFE6; --ink:#2A2521; --accent:#6C2F36; --muted:#7A6E62;
  --line:#DCD3C4; --card:#FBF7F0; --tabbar:rgba(244,239,230,.93);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);}
body{margin:0;color:var(--ink);font-family:'ChillRound',-apple-system,'PingFang SC',sans-serif;font-size:15px;line-height:1.72;}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 70px;}
header{padding:22px 0 12px;}
.masthead{display:flex;align-items:baseline;justify-content:space-between;}
h1{font-size:34px;margin:0;font-family:'BarlowCond','ChillRound';font-weight:700;line-height:1;}
h1 .dot{color:var(--accent);}
.dateline{font-size:11.5px;color:var(--muted);margin-top:7px;display:inline-flex;gap:5px;align-items:center;}
.dateline .pick{border-bottom:1px dotted var(--line);padding-bottom:1px;}
.navrow{display:flex;gap:7px;align-items:center;margin:0 -16px;padding:9px 16px;background:var(--tabbar);border-bottom:1px solid var(--line);}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);font-family:inherit;font-size:13px;padding:6px 13px;border-radius:999px;white-space:nowrap;}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--bg);}
.searchbx{flex:1;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--muted);}
.lead{margin-top:20px;border-left:2px solid var(--accent);padding-left:13px;}
.lead .kicker{font-size:10.5px;letter-spacing:1.4px;color:var(--muted);}
.lead h2{font-size:22px;margin:4px 0 8px;line-height:1.45;font-weight:500;}
.lead p{margin:0;font-size:14.5px;opacity:.9;}
.ghost{opacity:.35;margin-top:26px;}
.ghost .g{height:11px;background:var(--line);border-radius:2px;margin:9px 0;}

/* ===== 抽屉 ===== */
.scrim{position:fixed;inset:0;background:rgba(30,22,16,.20);}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:320px;max-width:88vw;
  background:var(--card);border-left:1px solid var(--line);
  box-shadow:-6px 0 24px rgba(40,30,20,.10);
  display:flex;flex-direction:column;
}
.dh{display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 13px;border-bottom:1px solid var(--line);}
.dh b{font-size:15px;font-weight:500;letter-spacing:.5px;}
.dh .x{border:1px solid var(--line);background:transparent;color:var(--muted);
  width:26px;height:26px;border-radius:999px;font-size:12px;line-height:1;font-family:inherit;}
.dbody{flex:1;overflow-y:auto;padding:4px 18px 22px;display:flex;flex-direction:column;}
section{padding:17px 0;border-bottom:1px solid var(--line);}
section:last-child{border-bottom:none;}
.cap{font-size:10.5px;letter-spacing:1.6px;color:var(--muted);margin-bottom:9px;}
.cap .hint{letter-spacing:.3px;opacity:.6;margin-left:6px;font-size:10px;}

/* 字体 */
.fonts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
.f{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;
  color:var(--ink);font-family:inherit;font-size:12.5px;padding:7px 9px;border-radius:6px;cursor:pointer;}
.f .fs{font-size:17px;line-height:1;opacity:.9;}
.f.on{border-color:var(--accent);color:var(--accent);background:rgba(108,47,54,.06);}

/* 字号 */
.sizes{display:flex;gap:6px;}
.sz{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);
  font-family:inherit;border-radius:6px;padding:8px 0;font-size:12.5px;cursor:pointer;}
.sz.on{border-color:var(--accent);color:var(--accent);background:rgba(108,47,54,.06);}
.sz .n{display:block;line-height:1.5;}

/* 巧克力格 */
.choc{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.ch{position:relative;border:none;padding:0;background:transparent;cursor:pointer;}
.ch .sq{height:50px;border-radius:5px;border:1px solid rgba(0,0,0,.10);overflow:hidden;
  display:flex;flex-direction:column;}
.ch .sq .b{flex:1;background:var(--b);}
.ch .sq .a{height:13px;background:var(--a);}
.ch .nm{display:block;font-size:10.5px;color:var(--muted);margin-top:4px;letter-spacing:.3px;}
.ch.on .sq{outline:1.5px solid var(--accent);outline-offset:1.5px;}
.ch.on .nm{color:var(--accent);}
.detail{margin-top:10px;font-size:11px;color:var(--muted);font-family:'BarlowCond',ui-monospace,monospace;
  letter-spacing:.4px;display:flex;align-items:center;gap:8px;}
.detail .sw2{width:11px;height:11px;border-radius:2px;border:1px solid rgba(0,0,0,.12);}

/* 开关 */
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:13.5px;}
.sw{width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;}
.sw i{position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:999px;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.18);transition:.2s;}
.sw.on{background:var(--accent);}
.sw.on i{left:19.5px;}
.note{font-size:11px;color:var(--muted);opacity:.9;padding-top:2px;}
.foot{margin-top:auto;font-size:10.5px;color:var(--muted);opacity:.75;letter-spacing:.4px;
  border-top:1px solid var(--line);padding:13px 0 2px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="masthead">
      <h1>730pm<span class="dot">.</span></h1>
      <button class="chip" style="font-size:12px;padding:5px 12px">设置</button>
    </div>
    <div class="dateline"><span class="pick">2026年10月29日 · 星期四 · 第 008 期</span><span>▾</span></div>
  </header>
  <nav class="navrow">
    <button class="chip on">头条</button>
    <button class="chip">今日阅读</button>
    <button class="chip">全部 ▾</button>
    <div class="searchbx">搜索本期</div>
  </nav>
  <div class="lead">
    <div class="kicker">榜单第一，门只开一条缝</div>
    <h2>谷歌 Gemini 4 Carbon：登顶了，但先只给守网络的人用</h2>
    <p>当地时间 10 月 28 日，谷歌发布 Gemini 4 Carbon——距 Gemini 4 Argon 只隔两周。谷歌称这是它最强的模型……</p>
  </div>
  <div class="ghost">
    <div class="g" style="width:82%"></div><div class="g"></div><div class="g" style="width:74%"></div>
    <div class="g" style="width:88%"></div><div class="g" style="width:60%"></div>
  </div>
</div>

<div class="scrim"></div>

<aside class="drawer">
  <div class="dh"><b>设置</b><button class="x">✕</button></div>
  <div class="dbody">

    <section>
      <div class="cap">字体</div>
      <div class="fonts">
        <button class="f on"><span class="fs" style="font-family:ChillRound">永</span><span>圆体</span></button>
        <button class="f"><span class="fs" style="font-family:-apple-system,'PingFang SC',sans-serif">永</span><span>黑体</span></button>
        <button class="f"><span class="fs" style="font-family:Georgia,'Songti SC',serif">永</span><span>宋体</span></button>
        <button class="f"><span class="fs" style="font-family:'Kaiti SC',STKaiti,serif">永</span><span>楷体</span></button>
      </div>
    </section>

    <section>
      <div class="cap">字号</div>
      <div class="sizes">
        <button class="sz"><span class="n" style="font-size:11px">小</span></button>
        <button class="sz on"><span class="n" style="font-size:13px">标准</span></button>
        <button class="sz"><span class="n" style="font-size:15px">大</span></button>
        <button class="sz"><span class="n" style="font-size:17px">特大</span></button>
      </div>
    </section>

    <section>
      <div class="cap">配色<span class="hint">底色 / 强调</span></div>
      <div class="choc">
        <button class="ch on" style="--b:#F4EFE6;--a:#6C2F36"><span class="sq"><span class="b"></span><span class="a"></span></span><span class="nm">旧报</span></button>
        <button class="ch" style="--b:#F1F2EF;--a:#3C5A4E"><span class="sq"><span class="b"></span><span class="a"></span></span><span class="nm">霜白</span></button>
        <button class="ch" style="--b:#EFE5D4;--a:#8A4B2A"><span class="sq"><span class="b"></span><span class="a"></span></span><span class="nm">砂纸</span></button>
        <button class="ch" style="--b:#EDF1F6;--a:#2B4A70"><span class="sq"><span class="b"></span><span class="a"></span></span><span class="nm">靛蓝</span></button>
        <button class="ch" style="--b:#F6F0F3;--a:#7C4B6E"><span class="sq"><span class="b"></span><span class="a"></span></span><span class="nm">藕荷</span></button>
        <button class="ch" style="--b:#F2EDE3;--a:#6B5334"><span class="sq"><span class="b"></span><span class="a"></span></span><span class="nm">茶褐</span></button>
        <button class="ch" style="--b:#EDF0EA;--a:#4A6350"><span class="sq"><span class="b"></span><span class="a"></span></span><span class="nm">竹青</span></button>
        <button class="ch" style="--b:#17140F;--a:#C6ACDC"><span class="sq"><span class="b"></span><span class="a"></span></span><span class="nm">夜墨</span></button>
      </div>
      <div class="detail"><span class="sw2" style="background:#F4EFE6"></span>#F4EFE6<span class="sw2" style="background:#6C2F36;margin-left:6px"></span>#6C2F36</div>
    </section>

    <section>
      <div class="row"><span>夜间模式</span><span class="sw"><i></i></span></div>
      <div class="row"><span>夜间模式跟随系统</span><span class="sw off"><i></i></span></div>
      <div class="note">跟着系统走时，上面那个手动开关就不作数了。</div>
    </section>

    <div class="foot">改动即时生效 · 只存在这台设备上</div>

  </div>
</aside>
</body>
</html>
