<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>730pm · 往期</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="theme-color" content="#F4EFE6">
<meta name="robots" content="noindex, nofollow">
<style>
@font-face { font-family:'ChillRound'; src:url('fonts/ChillRoundGothic_Medium.ttf') format('truetype'); font-weight:500; font-display:swap; }
@font-face { font-family:'BarlowCond'; src:url('fonts/BarlowCondensed-Bold.ttf') format('truetype'); font-weight:700; font-display:swap; }
:root {
  --bg:#F4EFE6; --ink:#2A2521; --accent:#6C2F36; --muted:#7A6E62;
  --line:#DCD3C4; --card:#FBF7F0; --tabbar:rgba(244,239,230,.93);
}
html[data-theme="night"] {
  --bg:#17140F; --ink:#C8BFB2; --accent:#C6ACDC; --muted:#8A8074;
  --line:#332C24; --card:#1F1B15; --tabbar:rgba(23,20,15,.93);
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); }
body {
  margin:0; color:var(--ink);
  font-family:'ChillRound',-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif;
  font-size:15px; line-height:1.72; -webkit-font-smoothing:antialiased;
  transition:background .25s ease, color .25s ease;
}
.wrap { max-width:720px; margin:0 auto; padding:0 16px 70px; }
header { padding:22px 0 12px; }
.masthead { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
h1 { font-size:34px; margin:0; letter-spacing:.5px; font-weight:700;
     font-family:'BarlowCond','ChillRound',sans-serif; line-height:1; }
h1 .dot { color:var(--accent); }
h1 a { color:inherit; text-decoration:none; }
.dateline { font-size:11.5px; color:var(--muted); letter-spacing:.4px; margin-top:7px; }
#themeBtn { background:transparent; border:1px solid var(--line); color:var(--muted);
  border-radius:999px; padding:4px 11px; font-size:12px; font-family:inherit;
  cursor:pointer; align-self:center; }
#themeBtn:active { opacity:.6; }

.bar { position:sticky; top:0; z-index:20; display:flex; gap:8px; align-items:center;
  margin:0 -16px; padding:10px 16px; background:var(--tabbar);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line); }
.bar .chip { flex:0 0 auto; border:1px solid var(--line); background:transparent;
  color:var(--muted); font-family:inherit; font-size:13.5px; padding:6px 15px;
  border-radius:999px; cursor:pointer; white-space:nowrap; text-decoration:none; }
.bar .chip.on { background:var(--accent); border-color:var(--accent); color:var(--bg); }
.bar .hint { margin-left:auto; font-size:11.5px; color:var(--muted); }

.list { margin:18px 0 0; }
.row { display:flex; align-items:baseline; gap:12px; padding:14px 2px;
  border-bottom:1px dashed var(--line); cursor:pointer; }
.row:active { opacity:.6; }
.row .no { font-size:12px; color:var(--accent); letter-spacing:1px; min-width:64px; }
.row .dt { font-size:15px; flex:1; }
.row .cnt { font-size:11.5px; color:var(--muted); }
.empty { margin-top:30px; color:var(--muted); font-size:13.5px; }

.lead { margin:20px 0 6px; padding:16px 17px; background:var(--card); border-left:3px solid var(--accent); }
.kicker { font-size:11px; letter-spacing:1.6px; color:var(--accent); margin-bottom:5px; }
.lead h2 { font-size:19px; margin:0 0 8px; line-height:1.5; font-weight:500; }
.lead p { margin:0; font-size:14px; }
.lead .src { font-size:11.5px; color:var(--muted); margin-top:8px; }
.lead .src a { color:var(--accent); text-decoration:none; }

.group { margin:22px 0 0; }
.gname { font-size:12.5px; letter-spacing:1.4px; color:var(--accent);
  border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:12px; }
.item { padding:12px 0 13px; border-bottom:1px dashed var(--line); }
.item:last-child { border-bottom:none; }
.item .t { font-size:15px; font-weight:500; margin-bottom:4px; }
.item .t a { color:inherit; text-decoration:none; }
.item .d { font-size:13.5px; color:var(--muted); }
footer { margin-top:40px; padding-top:13px; border-top:1px solid var(--line);
  font-size:11px; color:var(--muted); text-align:center; letter-spacing:.4px; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="masthead">
      <h1><a href="index.html">730pm<span class="dot">.</span></a></h1>
      <button id="themeBtn" aria-label="切换日夜">夜间</button>
    </div>
    <div class="dateline" id="dateline">往期 · 近 30 天</div>
  </header>

  <div class="bar">
    <button class="chip" id="backBtn" hidden>← 目录</button>
    <a class="chip" href="index.html" id="todayBtn">今天</a>
    <span class="hint" id="hint"></span>
  </div>

  <main>
    <div class="list" id="list"></div>
    <div id="reader" hidden></div>
  </main>

  <footer>730pm · 每日 19:30 更新 · 往期保留 30 天</footer>
</div>

<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('themeBtn');
  var meta=document.querySelector('meta[name=theme-color]');
  function apply(t){
    root.setAttribute('data-theme',t);
    btn.textContent = t==='night' ? '日间' : '夜间';
    if(meta) meta.setAttribute('content', t==='night' ? '#17140F' : '#F4EFE6');
  }
  apply(localStorage.getItem('np-theme')||'day');
  btn.addEventListener('click', function(){
    var n = root.getAttribute('data-theme')==='night' ? 'day' : 'night';
    try{ localStorage.setItem('np-theme', n); }catch(e){}
    apply(n);
  });

  var listEl=document.getElementById('list'), readerEl=document.getElementById('reader');
  var backBtn=document.getElementById('backBtn'), hint=document.getElementById('hint');
  var dateline=document.getElementById('dateline'), cache={};

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function showList(){
    readerEl.hidden=true; readerEl.innerHTML='';
    listEl.hidden=false; backBtn.hidden=true;
    var d=dateline.getAttribute('data-base')||'往期 · 近 30 天';
    dateline.textContent=d;
    if(history.state && history.state.d) history.pushState({}, '', location.pathname);
  }

  function renderIssue(data){
    var out=[];
    var lead=data.lead||{};
    if(lead.title){
      out.push('<div class="lead">'+
        (lead.kicker?'<div class="kicker">'+esc(lead.kicker)+'</div>':'')+
        '<h2>'+esc(lead.title)+'</h2>'+
        (lead.body?'<p>'+esc(lead.body)+'</p>':'')+
        (lead.source||lead.u?'<div class="src">'+esc(lead.source||'')+
          (lead.u?' <a href="'+esc(lead.u)+'" target="_blank" rel="noopener">原文</a>':'')+'</div>':'')+
        '</div>');
    }
    (data.tabs||[]).forEach(function(tab){
      var groups=tab.groups||[];
      var body=[];
      groups.forEach(function(g){
        var items=g.items||[];
        if(!items.length) return;
        body.push('<div class="group">'+(g.name?'<div class="gname">'+esc(g.name)+'</div>':''));
        items.forEach(function(it){
          var title=it.t||it.title||'';
          var desc=it.d||it.body||'';
          var url=it.u||it.url||'';
          body.push('<div class="item"><div class="t">'+
            (url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(title)+'</a>':esc(title))+
            '</div>'+(desc?'<div class="d">'+esc(desc)+'</div>':'')+'</div>');
        });
        body.push('</div>');
      });
      if(body.length) out.push(body.join(''));
    });
    readerEl.innerHTML=out.join('');
  }

  function open(dateKey){
    listEl.hidden=true; readerEl.hidden=false; backBtn.hidden=false;
    hint.textContent='';
    readerEl.innerHTML='<div class="empty">正在翻……</div>';
    var load = cache[dateKey] ? Promise.resolve(cache[dateKey])
      : fetch('issues/'+dateKey+'.json').then(function(r){
          if(!r.ok) throw new Error('没有这一期'); return r.json(); });
    load.then(function(data){
      cache[dateKey]=data;
      dateline.textContent=(data.date||dateKey)+(data.weekday?' · '+data.weekday:'')+(data.issue?' · '+data.issue:'');
      renderIssue(data);
      window.scrollTo(0,0);
      if(location.hash!=='#'+dateKey) history.pushState({d:dateKey}, '', '#'+dateKey);
    }).catch(function(){
      readerEl.innerHTML='<div class="empty">这一期没找到，可能已经超出 30 天。</div>';
    });
  }

  function renderList(issues){
    if(!issues.length){
      listEl.innerHTML='<div class="empty">还没有往期。</div>'; return;
    }
    listEl.innerHTML = issues.map(function(it){
      return '<div class="row" data-d="'+esc(it.date)+'">'+
        '<span class="no">'+esc(it.issue||'')+'</span>'+
        '<span class="dt">'+esc(it.label||it.date)+'</span>'+
        '<span class="cnt">'+esc(it.count||0)+' 条</span></div>';
    }).join('');
    listEl.querySelectorAll('.row').forEach(function(row){
      row.addEventListener('click', function(){ open(row.getAttribute('data-d')); });
    });
  }

  fetch('issues/index.json', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      var issues=(d.issues||[]).slice().sort(function(a,b){ return a.date<b.date?1:-1; });
      renderList(issues);
      var key=(location.hash||'').replace('#','');
      if(key && /^\d{4}-\d{2}-\d{2}$/.test(key)) open(key);
    })
    .catch(function(){
      listEl.innerHTML='<div class="empty">索引读不到，可能还没生成。</div>';
    });

  backBtn.addEventListener('click', function(){
    history.replaceState({}, '', location.pathname);
    showList();
  });
  window.addEventListener('popstate', function(){
    var key=(location.hash||'').replace('#','');
    if(key) open(key); else showList();
  });
})();
</script>
</body>
</html>
